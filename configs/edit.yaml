project_root: .
stage2_dir: outputs/stage2
stage2_ckpt: gaussians3d.pt

# 训练用的原始帧目录（你仓库里一般是 data/frames）
frames_dir: data/frames
use_gt_background: true
frame_idx: 0

# 输出目录
out_dir: outputs/edits

# 渲染分辨率：最好等于你的训练帧分辨率
H: 480
W: 640

# 这里才是真正“编辑”：基于 stage2 高斯做轻量修改（示例）
edit:
  global_translate: [0.0, 0.0, 0.0]
  global_scale: 1.0
  rgb_gain: [1.0, 1.0, 1.0]
  opacity_gain: 1.0
