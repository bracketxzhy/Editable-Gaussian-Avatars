project_root: .
seed: 42
log_dir: outputs/logs

data:
  frames_dir: data/frames/input
  # Optional: Human3.6M multi-view selection (same as stage1).
  # h36m:
  #   root_dir: data/frames/input/human3.6/S1
  #   images_list: data/frames/input/human3.6/h36m_annot/train_images.txt
  #   subject: S1
  #   action: Directions
  #   trial: 1
  #   cameras: [54138969, 55011271, 58860488, 60457274]
  #   stride: 1
  #   max_images: -1

stage2:
  stage1_dir: outputs/stage1
  out_dir: outputs/stage2
  init_mesh_obj: smpl_mesh_tpose.obj
  enable_tf32: true
  cudnn_benchmark: true

  # ---------- Stage2 training schedule (Stage A: stabilize) ----------
  n_frames: 8
  n_gaussians: 120000
  sample_on_surface: true
  # Extra background gaussians (unbound)
  n_gaussians_bg: 0
  bg_extent: [4.0, 4.0, 1.0]
  bg_center_z: 2.5
  bg_log_scale: -3.5
  bg_opacity_logit: -4.0
  # Keep background away from the body to reduce ghosting
  bg_exclude_bbox_pad: 0.2
  # Low-precision background (unused when n_gaussians_bg=0)
  bg_grad_scale: 0.2
  bg_opacity_logit_max: -3.5
  bg_log_scale_min: -3.5
  bg_log_scale_max: -2.0
  # Foreground constraints: allow enough opacity while keeping splats small
  fg_opacity_logit_max: 3.2
  fg_log_scale_min: -6.5
  fg_log_scale_max: -4.6
  iters: 50000

  # Learning rates
  lr_gauss: 0.002
  lr_cam: 0.0
  camera_mode: fixed
  cam_t_prior: [0.0, 0.0, 0.0]
  cam_reg_weight: 0.0
  cam_warmup_iters: 0
  l1_weight: 0.3
  use_alpha_mask: true
  alpha_threshold: 0.03
  # Keypoint-guided foreground fitting and face detail emphasis.
  keypoints_json: outputs/stage1/keypoints.json
  kpt_conf_min: 0.2
  kpt_box_pad: 0.12
  use_kpt_bbox_mask: false
  face_weight: 1.4
  face_conf_min: 0.25
  face_box_pad: 0.18
  bg_rgb: [1.0, 1.0, 1.0]
  # Use the last 5 frames: current frame + previous 4-frame temporal reference.
  frame_select: last_k
  # Temporal reference for current frame:
  # each iteration anchors on the last frame, and adds previous frames with exponential decay.
  temporal_ref_anchor: last
  temporal_ref_window: 4
  temporal_ref_decay: 0.86

  # ---------- Dynamic binding to SMPL mesh sequence ----------
  # Require stage1.export_meshes=true to generate outputs/stage1/smpl_mesh_sequence
  bind_to_mesh: true
  bind_mesh_sequence_dir: outputs/stage1/smpl_mesh_sequence
  bind_cache_size: 8
  # stage1 exports meshes in Blender coordinates; convert back to camera coords for training
  bind_mesh_to_camera: true
  bind_inverse_export_upright: true
  bind_mesh_offset: [0.0, 0.0, 0.0]
  # Human-only supervision from SMPL silhouette.
  use_smpl_silhouette_mask: true
  smpl_mask_dilate_px: 0
  smpl_mask_erode_px: 2
  # Inner-mask color supervision: avoid boundary color leakage but keep head/torso details.
  smpl_color_mask_erode_px: 2
  smpl_alpha_leak_weight: 0.4
  smpl_mask_override_alpha: true
  smpl_mask_precompute: true
  smpl_mask_precompute_max_frames: 64

render:
  stage2_dir: outputs/stage2
  out_dir: outputs/renders/fg_only
  clear_out_dir_pngs: true
  frames_dir: data/frames/input
  frame_select: last
  max_frames: 1
  bg: [1.0, 1.0, 1.0]
  # Larger view range (smaller K -> wider FOV)
  k_scale: 1.0
  # Foreground high-res, background low-res
  fg_scale: 1.0
  bg_scale: 1.0
  split_by_bind: false
  render_bound_only: true
  bound_alpha_threshold: 0.28
  bound_opacity_min: 0.05
  fg_mask_mode: smpl
  fg_mask_dilate_px: 0
  fg_mask_erode_px: 2
  overlay_smpl_skeleton: true
  smpl_skeleton_source: theta
  smpl_skeleton_npz: outputs/stage1/smpl_skeleton_sequence.npz
  smpl_joints_npz: outputs/stage1/smpl_joints_sequence.npz
  smpl_skeleton_color_bgr: [0, 255, 0]
  smpl_skeleton_line_thickness: 2
  smpl_skeleton_joint_radius: 3
  use_gt_background: false
  bind_mesh_sequence_dir: outputs/stage1/smpl_mesh_sequence
  bind_sequence_npz: outputs/stage1/smpl_params_sequence.npz
  # stage1 exports meshes in Blender coordinates; convert back to camera coords for rendering
  bind_mesh_to_camera: true
  bind_inverse_export_upright: true
  bind_mesh_offset: [0.0, 0.0, 0.0]
