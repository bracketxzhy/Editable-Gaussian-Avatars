project_root: .
seed: 42
log_dir: outputs/logs

data:
  frames_dir: data/frames/input

stage2:
  stage1_dir: outputs/stage1
  out_dir: outputs/stage2
  init_mesh_obj: ""
  enable_tf32: true
  cudnn_benchmark: true

  # ---------- Stage2 training schedule (Stage A: stabilize) ----------
  n_frames: 0
  n_gaussians: 50000
  sample_on_surface: true
  # Extra background gaussians (unbound)
  n_gaussians_bg: 0
  bg_extent: [4.0, 4.0, 1.0]
  bg_center_z: 2.5
  bg_log_scale: -3.5
  bg_opacity_logit: -3.0
  # Keep background away from the body to reduce ghosting
  bg_exclude_bbox_pad: 0.2
  # Low-precision background (unused when n_gaussians_bg=0)
  bg_grad_scale: 1.0
  bg_opacity_logit_max: -3.5
  bg_log_scale_min: -3.5
  bg_log_scale_max: -2.0
  # Foreground constraints: allow enough opacity while keeping splats small
  fg_opacity_logit_max: 3.2
  fg_log_scale_min: -7.2
  fg_log_scale_max: -5.9
  outer_log_scale_min: -7.8
  outer_log_scale_max: -5.8
  outer_prune_support_th: 0.001
  iters: 1200

  # Learning rates
  lr_gauss: 0.003
  lr_cam: 0.0
  camera_mode: fixed
  cam_t_prior: [0.0, 0.0, 0.0]
  cam_reg_weight: 0.0
  cam_warmup_iters: 0
  l1_weight: 0.6
  use_alpha_mask: false
  alpha_threshold: 0.03
  # Generic training profile: avoid scene-specific part priors.
  keypoints_json: outputs/stage1/keypoints.json
  kpt_conf_min: 0.2
  kpt_box_pad: 0.12
  use_kpt_bbox_mask: false
  face_weight: 1.0
  face_conf_min: 0.35
  face_box_pad: 0.10
  face_use_ears: false
  hand_weight: 1.0
  hand_conf_min: 0.25
  hand_radius_scale: 0.45
  hand_radius_min_px: 10
  hand_extension_scale: 0.35
  outer_exclude_hands: false
  outer_hand_expand_px: 0
  bg_rgb: [1.0, 1.0, 1.0]
  # Dataset-agnostic coverage: sample frames uniformly across the full sequence.
  frame_select: stage1_sequence
  # Use per-frame optimization without forcing last-frame anchoring.
  temporal_ref_anchor: sample
  temporal_ref_window: 0
  temporal_ref_decay: 0.86

  # ---------- Dynamic binding to SMPL mesh sequence ----------
  # Require stage1.export_meshes=true to generate outputs/stage1
  bind_to_mesh: true
  bind_mesh_sequence_dir: outputs/stage1
  bind_cache_size: 32
  # auto: detect mesh OBJ coordinate space from stage1 metadata.
  bind_mesh_obj_space: auto
  bind_align_quat_to_mesh_normals: true
  bind_quat_normal_blend: 1.0
  bind_surface_aniso_weight: 0.002
  bind_surface_aniso_margin: 0.15
  bind_mesh_to_camera: true
  bind_inverse_export_upright: true
  bind_mesh_offset: [0.0, 0.0, 0.0]
  # Extra rigid alignment (R,t) applied on top of SMPL verts.
  # Does NOT change SMPL pose/betas/trans parameters.
  bind_rigid_align:
    enable: true
    auto: false
    pre_stage2: false
    require_pre_stage2: true
    require_quality: false
    min_iou_after: 0.70
    max_outside_after: 0.20
    init_from_bbox: true
    use_best_if_quality_fail: true
    person_masks_npz: outputs/stage1/person_masks.npz
    sample_frames: 4
    eval_downsample: 0.35
    outside_weight: 2.0
    levels: 2
    iters_per_level: 1
    rot_step_deg: 3.0
    trans_step: [0.04, 0.04, 0.06]
    max_rot_deg: 20.0
    max_trans: [0.35, 0.35, 0.45]
  binding:
    mode: games_face
    hybrid_weight: 0.0
    eps_normal: 0.001
    curv_conf_tau: 0.2
    curv_degen_tau: 0.0001
    temporal_frame: true
    scale_clamp_min: 0.0005
    scale_clamp_max: 0.25
    outer_geom_scale_blend: 0.02
    outer_scale_clamp_max: 0.015
    max_temporal_angle_deg: 75.0
    temporal_alpha: 0.35
    debug_assertions: false
    hybrid_dynamic: true
    mix_w_min: 0.05
    mix_w_max: 0.95
    mix_coef_curv: 1.0
    mix_coef_edge: 0.8
    mix_coef_residual: 0.7
    mix_coef_normal_var: 0.6
    mix_bias: 1.1
  # Human-only supervision from SMPL silhouette.
  use_smpl_silhouette_mask: true
  smpl_mask_dilate_px: 0
  smpl_mask_erode_px: 0
  smpl_color_mask_erode_px: 0
  inner_use_strict_smpl_mask: true
  smpl_alpha_leak_weight: 0.12
  smpl_mask_override_alpha: false
  smpl_mask_precompute: true
  smpl_mask_precompute_max_frames: 32
  # Dataset-agnostic person/background separation (not tied to green-screen assumptions).
  use_person_mask: true
  person_masks_npz: outputs/stage1/person_masks.npz
  person_mask_dilate_px: 0
  person_mask_erode_px: 0
  person_mask_fuse_mode: intersect
  person_mask_eval_clean: false
  person_mask_eval_refine_grabcut: false
  person_mask_contour_width_px: 2
  person_mask_contour_leak_weight: 0.0
  # Outer layer supervision from per-frame GT contour (not SMPL silhouette).
  outer_use_gt_contour: true
  outer_gt_contour_fuse_mode: gt_only
  outer_gt_contour_grabcut_scale: 0.7
  outer_gt_contour_grabcut_iters: 3
  outer_head_priority_enable: true
  outer_head_priority_weight: 1.2
  outer_head_priority_face_pad: 0.55
  outer_head_priority_up_scale: 2.8
  outer_head_priority_down_scale: 0.40
  outer_head_priority_person_top_ratio: 0.18
  outer_head_support_th: 0.08
  outer_trigger_smpl_gap_px: 0
  outer_trigger_edge_th: 0.06
  outer_trigger_min_pixels: 4
  outer_trigger_ring_width_px: 2
  outer_trigger_use_edge_gate: false
  outer_contour_inside_only: true
  outer_head_support_sample_dilate_px: 0
  outer_exclude_face: false
  outer_face_expand_px: 0
  outer_face_exclude_lower_ratio: 0.65
  outer_silhouette_weight: 0.12
  outer_silhouette_band_px: 2
  outer_silhouette_band_weight: 2.0
  detail_hf_weight: 0.0
  detail_hf_exclude_face: true
  outer_inside_support_th: 0.03
  outer_outside_support_th: 0.10
  outer_outside_opacity_cap: 0.03
  outer_outside_offset_decay: 0.97
  outer_outside_opacity_weight: 0.08
  outer_outside_offset_weight: 0.01
  separate_fg_bg_training: true
  fg_region_weight: 1.6
  bg_region_weight: 0.8
  # Speed-up with safety: stop when loss plateaus.
  early_stop_enable: false
  early_stop_patience: 0
  early_stop_min_delta: 0.00001
  early_stop_warmup_iters: 0

  # ---------- Adaptive hybrid + dual-layer shell (validation) ----------
  inner_count_auto: true
  inner_count_kV: 1.2
  inner_count_kF: 0.35
  inner_count_min: 55000
  inner_count_max: 220000

  tau_vis: 0.15
  frame_weight_k: 1.5
  use_robust_loss: true
  robust_loss_type: charbonnier
  alpha_prior_weight: 0.05
  inner_opacity_prior_target: 0.50
  outer_opacity_prior_target: 0.15
  cov_min: 0.0005
  cov_max: 0.25
  cov_penalty_weight: 0.05
  use_border_attenuation: true
  border_attenuation_width: 4
  V_min: 8
  densify_top_percent: 10.0

  phase0_ratio: 0.08
  phase2_ratio: 0.15
  phase_ratio_inner_only: 0.10
  phase_ratio_outer_only: 0.40
  phase_ratio_occlusion_simplify: 0.30
  phase_ratio_joint_finetune: 0.20

  shell_enable: true
  shell_init_ratio: 0.20
  outer_init_from_inner: false
  outer_dormant_slot_ratio: 0.22
  outer_dormant_face_ratio: 1.0
  outer_face_anchor_rule: centroid
  shell_max_ratio: 0.0
  shell_spawn_top_percent: 20.0
  shell_spawn_every: 80
  shell_prune_every: 1000
  shell_offset_max_n: 0.12
  shell_offset_max_t: 0.02
  outer_offset_unbounded: false
  outer_offset_auto_range_enable: true
  outer_offset_auto_range_min_scale: 0.50
  outer_offset_auto_range_edge_mix: 0.75
  outer_offset_edge_guided_reg: true
  outer_offset_reg_relax_support: true
  outer_offset_min_active_weight: 0.10
  outer_offset_min_target_scale: 0.25
  outer_offset_min_support_th: 0.03
  shell_offset_reg_weight: 0.001
  shell_offset_reg_phase0_scale: 0.20
  shell_offset_freeze_phase0: false
  inner_dual_candidate_enable: false
  inner_high_curv_dual_activate_th: 0.20
  inner_face_candidate_ratio: 0.35
  inner_vertex_candidate_ratio: 0.65
  inner_bind_mode_default: vertex
  outer_trigger_face_activate_enable: true
  outer_trigger_face_sample_dilate_px: 0
  outer_spawn_from_trigger_ring_only: false
  outer_viewplane_init_enable: true
  outer_center_init_rule: segment_midpoint
  outer_center_phase1_normal_tune_enable: true
  outer_center_phase1_normal_tune_cap: 0.04
  outer_center_freeze_after_phase1: true
  outer_contact_alpha_edge_th: 0.05
  outer_offset_grad_scale: 3.0
  outer_offset_edge_grad_scale: 2.0
  outer_offset_grad_scale_max: 8.0
  outer_support_weight: 1.0
  outer_spawn_support_th: 0.001
  outer_spawn_inside_only: false
  outer_phase_inner_vis_scale: 0.0
  outer_low_support_patience: 12
  outer_pruned_opacity_logit_max: -12.0
  outer_quality_log_every: 600
  outer_progress_log_every: 20
  outer_zero_stop_enable: false
  outer_zero_stop_patience: 120
  outer_zero_stop_warmup_iters: 200
  outer_zero_stop_after_phase_inner: true
  outer_boundary_enforce: off
  outer_boundary_check_every: 120
  bind_face_offset_straight_through: true
  outer_edge_trigger_enable: true
  outer_edge_trigger_weight: 0.45
  outer_edge_prune_protect_quantile: 0.95

  inner_occlusion_soft_enable: true
  inner_occlusion_hard_enable: true
  inner_soft_vis_th: 0.03
  inner_soft_contrib_th: 0.01
  outer_cover_vis_th: 0.22
  outer_cover_contrib_th: 0.03
  inner_soft_patience: 300
  inner_hard_patience: 800
  inner_soft_lr_scale: 0.3
  inner_prune_every: 400
  inner_prune_protect_parts: [face, hands]

  dual_quality_gate:
    enable: false
    mode: hard_and
    eval_every: 100
    warmup_iters: 3000
    color:
      metric: l1_rgb
      max_error: 0.065
      unstable_var_max: 0.020
      roi: person_intersect_smpl
    geometry:
      metric: contour_fscore
      min_score: 0.65
      residual_top_percent: 20
      edge_top_percent: 30
      roi: contour_band
    control:
      spawn_scale_if_fail: 0.35
      outer_lr_scale_if_fail: 0.8
      outer_alpha_cap_if_fail: 0.40
      prune_boost_if_fail: 1.05
      recover_patience: 2
      outer_color_band_weight: 0.03
      layer_alpha_balance_weight: 0.01

render:
  stage2_dir: outputs/stage2
  out_dir: outputs/renders
  save_main_image: false
  save_real_image: true
  real_out_subdir: real
  save_fg_nobg_skeleton: true
  fg_nobg_out_subdir: fg_only
  deform_render_image: true
  deform_out_subdir: deform
  clear_out_dir_pngs: true
  frames_dir: data/frames/input
  frame_select: last
  max_frames: 1
  bg: [1.0, 1.0, 1.0]
  # Larger view range (smaller K -> wider FOV)
  k_scale: 1.0
  center_subject: false
  subject_fit_enabled: false
  six_views_enable: true
  six_views_include_top_bottom: true
  # Foreground high-res, background low-res
  fg_scale: 1.0
  bg_scale: 1.0
  split_by_bind: false
  render_bound_only: true
  fg_only_render_bound_only: true
  deform_render_bound_only: true
  deform_smplx_use_standard_pose: true
  bound_alpha_threshold: 0.0
  bound_opacity_min: 0.0
  fg_mask_mode: none
  fg_mask_dilate_px: 0
  fg_mask_erode_px: 0
  fg_only_alpha_threshold: 0.0
  fg_only_alpha_gamma: 1.0
  fg_only_alpha_gain_max: 1.0
  deform_alpha_threshold: 0.0
  deform_alpha_gamma: 1.0
  deform_alpha_gain_max: 1.0
  overlay_smpl_skeleton: false
  debug_overlay_keypoints: false
  debug_bind_to_google_skeleton: false
  smpl_skeleton_source: joints
  smpl_skeleton_npz: outputs/stage1/smpl_skeleton_sequence.npz
  smpl_joints_npz: outputs/stage1/smpl_joints_sequence.npz
  smpl_skeleton_color_bgr: [0, 255, 0]
  smpl_skeleton_line_thickness: 0
  smpl_skeleton_joint_radius: 3
  use_gt_background: false
  bind_mesh_sequence_dir: outputs/stage1
  bind_sequence_npz: outputs/stage1/smpl_params_sequence.npz
  bind_mesh_obj_space: auto
  deform_mesh_obj_space: auto
  bind_rigid_align_auto_from_stage2: true
  bind_align_quat_to_mesh_normals: true
  bind_quat_normal_blend: 1.0
  bind_mesh_to_camera: true
  bind_inverse_export_upright: true
  bind_mesh_offset: [0.0, 0.0, 0.0]

